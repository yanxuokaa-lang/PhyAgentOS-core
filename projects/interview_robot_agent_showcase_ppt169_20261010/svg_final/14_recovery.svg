<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F3F7FB"/><rect width="1280" height="8" fill="#2471B4"/><text x="58" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17324D">长程执行：失败后恢复到节点，而不是重跑一切</text><text x="58" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#62788E">LongHorizonTaskController + PlanningLoopAdapter + PlanRevision</text><line x1="120" y1="260" x2="1130" y2="260" stroke="#C9D9E8" stroke-width="4"/><circle cx="150" cy="260" r="25" fill="#2471B4"/><circle cx="420" cy="260" r="25" fill="#2471B4"/><circle cx="690" cy="260" r="25" fill="#184CA0"/><circle cx="960" cy="260" r="25" fill="#5B9BD5"/><circle cx="1130" cy="260" r="25" fill="#5B9BD5"/><text x="150" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#17324D">running</text><text x="420" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#17324D">node settled</text><text x="690" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#184CA0">blocked / unknown</text><text x="960" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#184CA0">same-task PlanRevision</text><text x="1130" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#5B9BD5">verified</text><rect x="80" y="420" width="1120" height="130" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="2"/><text x="112" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#17324D">保留已完成节点与证据</text><text x="390" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#17324D">检查 invocation / scene / evidence</text><text x="748" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#17324D">只恢复受影响的下游节点</text><text x="112" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#62788E">pause · resume · replay · stop · bounded replan</text><text x="58" y="634" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#184CA0">unknown Action 不触发盲目重试。</text></svg>
