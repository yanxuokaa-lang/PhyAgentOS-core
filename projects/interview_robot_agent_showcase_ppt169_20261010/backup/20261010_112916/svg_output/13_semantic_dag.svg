<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F3F7FB"/><rect width="1280" height="8" fill="#2471B4"/><text x="58" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17324D">Agent 先提出语义任务，PAOS 再编译成执行 DAG</text><text x="58" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#62788E">对应仓库中的 AgentSubtaskSpec 与 compose_executable_pick_place_plan()</text><rect x="58" y="156" width="260" height="330" fill="#FFFFFF" stroke="#2471B4" stroke-width="2"/><text x="90" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2471B4">Agent semantic subtasks</text><text x="90" y="274" font-family="Consolas, Courier New, monospace" font-size="17" fill="#17324D">relocate_green</text><text x="90" y="316" font-family="Consolas, Courier New, monospace" font-size="17" fill="#17324D">entity_ref</text><text x="90" y="354" font-family="Consolas, Courier New, monospace" font-size="17" fill="#17324D">destination_ref</text><text x="90" y="392" font-family="Consolas, Courier New, monospace" font-size="17" fill="#17324D">depends_on</text><text x="90" y="430" font-family="Consolas, Courier New, monospace" font-size="17" fill="#17324D">required_evidence</text><line x1="318" y1="322" x2="390" y2="322" stroke="#2471B4" stroke-width="3"/><rect x="392" y="156" width="792" height="330" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="2"/><text x="430" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17324D">单对象任务执行链</text><text x="430" y="274" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2471B4">observe → capabilities → understand</text><text x="430" y="324" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2471B4">→ grasp → prepare → acquire → place</text><line x1="430" y1="360" x2="1128" y2="360" stroke="#C9D9E8" stroke-width="2"/><text x="430" y="414" font-family="Consolas, Courier New, monospace" font-size="17" fill="#5B9BD5">green.place ─┐</text><text x="430" y="450" font-family="Consolas, Courier New, monospace" font-size="17" fill="#5B9BD5">red.place   ─┴→ verify</text><text x="58" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#17324D">依赖、证据、资源和 Tool 候选在 PlanGraph 中显式保留；编译阶段不直接授权运动。</text></svg>
