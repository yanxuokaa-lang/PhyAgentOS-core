<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F3F7FB"/><rect width="1280" height="8" fill="#2471B4"/><text x="58" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17324D">PhyAgentOS：Agent 不直接碰机器人</text><text x="58" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#62788E">当前仓库的真实执行边界</text><rect x="58" y="154" width="1164" height="390" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="2"/><text x="90" y="210" font-family="Consolas, Courier New, monospace" font-size="21" fill="#17324D">AgentLoop + Planner</text><text x="90" y="265" font-family="Consolas, Courier New, monospace" font-size="21" fill="#2471B4">AgentTask / PlanRevision</text><text x="90" y="320" font-family="Consolas, Courier New, monospace" font-size="21" fill="#2471B4">ForgeToolClient</text><text x="90" y="375" font-family="Consolas, Courier New, monospace" font-size="21" fill="#2471B4">Gateway /tools → ToolInvocation</text><text x="90" y="430" font-family="Consolas, Courier New, monospace" font-size="21" fill="#17324D">ToolEndpoint / Dora / Robot or Simulator</text><text x="90" y="485" font-family="Consolas, Courier New, monospace" font-size="21" fill="#5B9BD5">Evidence + Verifier → verdict / PlanRevision</text><line x1="720" y1="202" x2="720" y2="492" stroke="#C9D9E8" stroke-width="2"/><text x="770" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#17324D">三类事实分离</text><text x="770" y="294" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#17324D">Execution：执行了什么</text><text x="770" y="348" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#17324D">Evidence：观测到了什么</text><text x="770" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#17324D">Verdict：目标是否完成</text><text x="770" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#184CA0">Action 接受 ≠ 动作完成</text></svg>
