<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F3F7FB"/><rect width="1280" height="8" fill="#2471B4"/><text x="58" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17324D">执行经验如何改变未来的 Skill-use</text><text x="58" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#62788E">经验模块只在归因、验证和审核之后影响后续工作流</text><rect x="58" y="176" width="180" height="96" fill="#FFFFFF" stroke="#2471B4" stroke-width="2"/><text x="148" y="216" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2471B4">AgentTask</text><text x="148" y="246" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#62788E">terminal outcome</text><rect x="300" y="176" width="180" height="96" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="2"/><text x="390" y="216" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17324D">TaskEpisode</text><text x="390" y="246" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#62788E">redacted trace</text><rect x="542" y="176" width="180" height="96" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="2"/><text x="632" y="216" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#17324D">Attribution</text><text x="632" y="246" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#62788E">failure owner</text><rect x="784" y="176" width="180" height="96" fill="#E8F1F9" stroke="#2471B4" stroke-width="2"/><text x="874" y="216" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2471B4">LessonCluster</text><text x="874" y="246" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#62788E">scoped advice</text><rect x="1026" y="176" width="180" height="96" fill="#17324D"/><text x="1116" y="216" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Skill revision</text><text x="1116" y="246" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#5B9BD5">review → promote</text><line x1="238" y1="224" x2="300" y2="224" stroke="#2471B4" stroke-width="3"/><line x1="480" y1="224" x2="542" y2="224" stroke="#2471B4" stroke-width="3"/><line x1="722" y1="224" x2="784" y2="224" stroke="#2471B4" stroke-width="3"/><line x1="964" y1="224" x2="1026" y2="224" stroke="#2471B4" stroke-width="3"/><rect x="100" y="380" width="1080" height="150" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="2"/><text x="140" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#17324D">一次失败不会直接改策略</text><text x="140" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#17324D">基础设施故障、证据不足和不确定归因保持为诊断</text><text x="140" y="518" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#2471B4">经过独立回放、审核与作用域校验，才进入后续 Skill-use</text></svg>
