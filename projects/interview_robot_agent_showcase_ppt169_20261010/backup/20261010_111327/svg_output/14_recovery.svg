<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4F7F8"/><rect width="1280" height="8" fill="#1C7C7A"/><text x="58" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#0B1F2A">长程执行：失败后恢复到节点，而不是重跑一切</text><text x="58" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#60727A">LongHorizonTaskController + PlanningLoopAdapter + PlanRevision</text><line x1="120" y1="260" x2="1130" y2="260" stroke="#D6E0E3" stroke-width="4"/><circle cx="150" cy="260" r="25" fill="#1C7C7A"/><circle cx="420" cy="260" r="25" fill="#1C7C7A"/><circle cx="690" cy="260" r="25" fill="#D95D39"/><circle cx="960" cy="260" r="25" fill="#F28C28"/><circle cx="1130" cy="260" r="25" fill="#2D9D78"/><text x="150" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#26343A">running</text><text x="420" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#26343A">node settled</text><text x="690" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#D95D39">blocked / unknown</text><text x="960" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#D26D10">same-task PlanRevision</text><text x="1130" y="330" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#2D9D78">verified</text><rect x="80" y="420" width="1120" height="130" fill="#FFFFFF" stroke="#D6E0E3" stroke-width="2"/><text x="112" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#26343A">保留已完成节点与证据</text><text x="390" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#26343A">检查 invocation / scene / evidence</text><text x="748" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#26343A">只恢复受影响的下游节点</text><text x="112" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#60727A">pause · resume · replay · stop · bounded replan</text><text x="58" y="634" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#D95D39">unknown Action 不触发盲目重试。</text></svg>
