<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4F7F8"/><rect width="1280" height="8" fill="#1C7C7A"/><text x="58" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#0B1F2A">PhyAgentOS：Agent 不直接碰机器人</text><text x="58" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#60727A">当前仓库的真实执行边界</text><rect x="58" y="154" width="1164" height="390" fill="#FFFFFF" stroke="#D6E0E3" stroke-width="2"/><text x="90" y="210" font-family="Consolas, Courier New, monospace" font-size="21" fill="#0B1F2A">AgentLoop + Planner</text><text x="90" y="265" font-family="Consolas, Courier New, monospace" font-size="21" fill="#1C7C7A">AgentTask / PlanRevision</text><text x="90" y="320" font-family="Consolas, Courier New, monospace" font-size="21" fill="#1C7C7A">ForgeToolClient</text><text x="90" y="375" font-family="Consolas, Courier New, monospace" font-size="21" fill="#1C7C7A">Gateway /tools → ToolInvocation</text><text x="90" y="430" font-family="Consolas, Courier New, monospace" font-size="21" fill="#0B1F2A">ToolEndpoint / Dora / Robot or Simulator</text><text x="90" y="485" font-family="Consolas, Courier New, monospace" font-size="21" fill="#2D9D78">Evidence + Verifier → verdict / PlanRevision</text><line x1="720" y1="202" x2="720" y2="492" stroke="#D6E0E3" stroke-width="2"/><text x="770" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0B1F2A">三类事实分离</text><text x="770" y="294" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#26343A">Execution：执行了什么</text><text x="770" y="348" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#26343A">Evidence：观测到了什么</text><text x="770" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#26343A">Verdict：目标是否完成</text><text x="770" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#D95D39">Action 接受 ≠ 动作完成</text></svg>
