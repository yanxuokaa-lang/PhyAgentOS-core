<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F4F7F8"/><rect width="1280" height="8" fill="#1C7C7A"/><text x="58" y="62" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#0B1F2A">Agent 先提出语义任务，PAOS 再编译成执行 DAG</text><text x="58" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#60727A">对应仓库中的 AgentSubtaskSpec 与 compose_executable_pick_place_plan()</text><rect x="58" y="156" width="260" height="330" fill="#FFFFFF" stroke="#1C7C7A" stroke-width="2"/><text x="90" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1C7C7A">Agent semantic subtasks</text><text x="90" y="274" font-family="Consolas, Courier New, monospace" font-size="17" fill="#26343A">relocate_green</text><text x="90" y="316" font-family="Consolas, Courier New, monospace" font-size="17" fill="#26343A">entity_ref</text><text x="90" y="354" font-family="Consolas, Courier New, monospace" font-size="17" fill="#26343A">destination_ref</text><text x="90" y="392" font-family="Consolas, Courier New, monospace" font-size="17" fill="#26343A">depends_on</text><text x="90" y="430" font-family="Consolas, Courier New, monospace" font-size="17" fill="#26343A">required_evidence</text><line x1="318" y1="322" x2="390" y2="322" stroke="#1C7C7A" stroke-width="3"/><rect x="392" y="156" width="792" height="330" fill="#FFFFFF" stroke="#D6E0E3" stroke-width="2"/><text x="430" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B1F2A">Per-object execution chain</text><text x="430" y="274" font-family="Consolas, Courier New, monospace" font-size="17" fill="#1C7C7A">observe → capabilities → understand</text><text x="430" y="324" font-family="Consolas, Courier New, monospace" font-size="17" fill="#1C7C7A">→ grasp → prepare → acquire → place</text><line x1="430" y1="360" x2="1128" y2="360" stroke="#D6E0E3" stroke-width="2"/><text x="430" y="414" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2D9D78">green.place ─┐</text><text x="430" y="450" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2D9D78">red.place   ─┴→ verify</text><text x="58" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#26343A">依赖、证据、资源和 Tool 候选在 PlanGraph 中显式保留；编译阶段不直接授权运动。</text></svg>
