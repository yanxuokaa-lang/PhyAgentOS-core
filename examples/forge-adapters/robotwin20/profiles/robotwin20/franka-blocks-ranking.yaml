schema_version: paos-robotwin20-runtime-profile/v1
task_name: blocks_ranking_rgb
task_config: demo_clean
embodiment: [franka-panda, franka-panda, 0.8]
additional_static_cameras:
  - name: front_camera
    type: D435
    position: [0.0, -0.45, 0.85]
    forward: [0.0, 1.0, -0.1]
    left: [-1.0, 0.0, 0.0]
# Pick-place requires one synchronized observation set so occluded entities are
# not later misrepresented as single-view or cross-view identities.
sensor_refs: [camera/head, camera/front]
max_observation_age_ms: 1000
seed: 0

# Adapter-owned identity used to bind independent readiness evidence.
robot_identity: franka-panda
gripper_identity: panda-gripper
embodiment_topology: two-single-arm
planner_profile: curobo
