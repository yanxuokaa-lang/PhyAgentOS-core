schema_version: paos-robotwin20-persistent-host/v1
agent:
  enabled: false
tools:
  enabled: true
host: 127.0.0.1
port: 19020
artifact_root: ${ROBOTWIN20_ARTIFACT_ROOT}
adapter_root: ${PAOS_ROBOTWIN20_ADAPTER_ROOT}
runtime_root: ${ROBOTWIN20_RUNTIME_ROOT}
runtime_profile: ${ROBOTWIN20_RUNTIME_PROFILE}
worker_python: ${ROBOTWIN20_WORKER_PYTHON}
materializer_python: ${ROBOTWIN20_MATERIALIZER_PYTHON}
perception_profile: ${ROBOTWIN20_PERCEPTION_PROFILE}
grasp_profile: ${ROBOTWIN20_GRASP_PROFILE}
materializer_arguments: ${ROBOTWIN20_MATERIALIZER_ARGUMENTS}
model:
  provider: qwen3_vl_vllm_fallback
  primary:
    api_base: http://127.0.0.1:8012/v1
    model: qwen3-vl-4b-awq
    api_key_env: ""
    timeout_seconds: 30
    max_output_tokens: 768
    lifecycle:
      enabled: true
      control_api_base: http://127.0.0.1:8012
      idle_timeout_s: 60
      control_timeout_s: 5
      sleep_level: 1
  fallback:
    api_base: ${ROBOTWIN20_MODEL_API_BASE}
    model: gpt-5.6-sol
    api_key_env: ROBOTWIN20_MODEL_API_KEY
    reasoning_effort: high
    timeout_seconds: 60
    max_output_tokens: 768
worker:
  startup_timeout_s: 180
  request_timeout_s: 360
  shutdown_timeout_s: 30
  action_max_duration_s: 300
materializer_timeout_s: 300
allow_benchmark_scene_facts: true
