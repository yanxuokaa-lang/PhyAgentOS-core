[project]
name = "paos-robotwin20-adapter"
version = "0.6.6"
description = "PAOS EnvironmentAdapter seam for RoboTwin20 sensor-backed observations."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0,<4"]
perception = ["numpy>=1.26,<3", "PyYAML>=6,<7"]
grasp = ["numpy>=1.26,<3", "PyYAML>=6,<7"]
collision = ["numpy>=1.26,<3", "scipy>=1.10,<2"]
qwen3-vl = [
  "torch>=2.6",
  "transformers>=4.57",
  "accelerate>=1.0",
  "safetensors>=0.5",
  "Pillow>=10",
  "compressed-tensors>=0.12",
]
qwen3-vl-vllm = [
  "openai>=2.46,<3",
]

[project.scripts]
robotwin20-preflight = "robotwin20_adapter.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotwin20_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
