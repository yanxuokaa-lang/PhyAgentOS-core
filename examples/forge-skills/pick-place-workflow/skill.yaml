      - ROBOTWIN20_MATERIALIZER_PYTHON
      - ROBOTWIN20_MODEL_API_BASE
      - ROBOTWIN20_MODEL
      - ROBOTWIN20_MODEL_API_KEY
    environment: {}
artifacts:
  resolver: local
  nodes:
    robotwin20_persistent_host:
      artifact_id: robotwin20_persistent_host-0.1.0-linux-x86_64
