      - SAM2_REPO_ROOT
      - SAM2_CHECKPOINT
      - GRASPGEN_PYTHON
      - GRASPGEN_CHECKPOINT
      - GRASPGEN_CONFIG
      - GRASPGEN_SOURCE_ROOT
