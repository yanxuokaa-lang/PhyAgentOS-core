      - ROBOTWIN20_MODEL_API_KEY
      - ROBOTWIN20_QWEN_MODEL_PATH
      - ROBOTWIN20_QWEN_PYTHON
      - LOCATEANYTHING_PYTHON
      - LOCATEANYTHING_CACHE_DIR
