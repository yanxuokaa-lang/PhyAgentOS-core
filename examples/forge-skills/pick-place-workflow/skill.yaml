    required_assets: []
    required_environment: []
    environment: {}
  robotwin-persistent:
    dataflow: profiles/robotwin-persistent/dataflow.yaml
    required_binaries:
      - robotwin20_persistent_host
    required_assets: []
    required_environment:
      - ROBOTWIN20_PAOS_PYTHON
      - ROBOTWIN20_ARTIFACT_ROOT
