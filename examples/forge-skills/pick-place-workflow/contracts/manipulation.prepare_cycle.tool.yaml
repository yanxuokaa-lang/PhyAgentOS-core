tool_id: manipulation.prepare_cycle
endpoint_id: cycle_preparation
operation: prepare
semantics: query
description: Prepare a complete manipulation cycle from empty hand without motion.
planning:
  schema_version: paos-tool-spec-policy/v1
  capabilities:
  - manipulation.prepare_cycle
  input_binding_keys:
  - entity_ref
  - destination_ref
  scene_write_behavior: none
input_schema:
  type: object
  additionalProperties: false
  properties:
    entity_ref:
      type: string
      minLength: 1
      pattern: ^entity://[^/]+$
    destination_ref:
      type: string
      minLength: 1
      pattern: ^destination://\S+$
    return_destination_ref:
      type: string
      minLength: 1
      pattern: ^destination://\S+$
    observation_ref:
      type: string
      minLength: 1
    scene_revision:
      type: string
      minLength: 1
    frame_id:
      type: string
      minLength: 1
    calibration_ref:
      type: string
      minLength: 1
    capability_snapshot_ref:
      type: string
      minLength: 1
    operation:
      enum:
      - pour_cycle
      - stir_cycle
      - manipulation_cycle
    parameters:
      type: object
    freshness_ms:
      type: integer
      minimum: 0
    max_age_ms:
      type: integer
      minimum: 1
  required:
  - entity_ref
  - destination_ref
  - return_destination_ref
  - observation_ref
  - scene_revision
  - frame_id
  - calibration_ref
  - capability_snapshot_ref
  - operation
  - parameters
  - freshness_ms
  - max_age_ms
  allOf:
  - if:
      properties:
        operation:
          const: pour_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            tilt_rad:
              type: number
              exclusiveMinimum: 0
              maximum: 3.141592653589793
            hold_s:
              type: number
              exclusiveMinimum: 0
          required:
          - tilt_rad
          - hold_s
  - if:
      properties:
        operation:
          const: stir_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            radius_m: &id001
              type: number
              exclusiveMinimum: 0
            depth_m: *id001
            turns: *id001
            duration_s: *id001
            direction:
              enum:
              - cw
              - ccw
          required:
          - radius_m
          - depth_m
          - turns
          - duration_s
          - direction
  - if:
      properties:
        operation:
          const: manipulation_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            process_type:
              enum:
              - pour
              - stir
              - handle_rotation
              - cap_unscrew
              - cap_screw
            engagement:
              enum:
              - held_object
              - tool
              - handle
              - cap
            hold_s: &id002
              type: number
              exclusiveMinimum: 0
            transform:
              type: object
              additionalProperties: false
              properties:
                mode:
                  enum:
                  - rotation
                  - translation
                axis:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                magnitude: *id002
                speed: *id002
                direction:
                  enum:
                  - cw
                  - ccw
                  - forward
                  - backward
                tolerance: *id002
              required:
              - mode
              - axis
              - magnitude
              - speed
              - direction
              - tolerance
          required:
          - process_type
          - engagement
          - hold_s
          - transform
output_schema:
  oneOf:
  - type: object
    additionalProperties: false
    required:
    - status
    - entity_ref
    - arguments
    - motion_authorized
    properties:
      status:
        const: available
      entity_ref: &id005
        type: string
        minLength: 1
      arguments:
        type: object
        additionalProperties: false
        properties:
          entity_ref:
            type: string
            minLength: 1
            pattern: ^entity://[^/]+$
          destination_ref:
            type: string
            minLength: 1
            pattern: ^destination://\S+$
          return_destination_ref:
            type: string
            minLength: 1
            pattern: ^destination://\S+$
          observation_ref:
            type: string
            minLength: 1
          scene_revision:
            type: string
            minLength: 1
          frame_id:
            type: string
            minLength: 1
          calibration_ref:
            type: string
            minLength: 1
          capability_snapshot_ref:
            type: string
            minLength: 1
          operation:
            enum:
            - pour_cycle
            - stir_cycle
            - manipulation_cycle
          parameters:
            type: object
          freshness_ms:
            type: integer
            minimum: 0
          max_age_ms:
            type: integer
            minimum: 1
          preparation_ref:
            type: string
            minLength: 1
          assignment_ref:
            type: string
            minLength: 1
        required:
        - entity_ref
        - destination_ref
        - return_destination_ref
        - observation_ref
        - scene_revision
        - frame_id
        - calibration_ref
        - capability_snapshot_ref
        - operation
        - parameters
        - freshness_ms
        - max_age_ms
        - preparation_ref
        - assignment_ref
        allOf:
        - if:
            properties:
              operation:
                const: pour_cycle
          then:
            properties:
              parameters:
                type: object
                additionalProperties: false
                properties:
                  tilt_rad:
                    type: number
                    exclusiveMinimum: 0
                    maximum: 3.141592653589793
                  hold_s:
                    type: number
                    exclusiveMinimum: 0
                required:
                - tilt_rad
                - hold_s
        - if:
            properties:
              operation:
                const: stir_cycle
          then:
            properties:
              parameters:
                type: object
                additionalProperties: false
                properties:
                  radius_m: &id003
                    type: number
                    exclusiveMinimum: 0
                  depth_m: *id003
                  turns: *id003
                  duration_s: *id003
                  direction:
                    enum:
                    - cw
                    - ccw
                required:
                - radius_m
                - depth_m
                - turns
                - duration_s
                - direction
        - if:
            properties:
              operation:
                const: manipulation_cycle
          then:
            properties:
              parameters:
                type: object
                additionalProperties: false
                properties:
                  process_type:
                    enum:
                    - pour
                    - stir
                    - handle_rotation
                    - cap_unscrew
                    - cap_screw
                  engagement:
                    enum:
                    - held_object
                    - tool
                    - handle
                    - cap
                  hold_s: &id004
                    type: number
                    exclusiveMinimum: 0
                  transform:
                    type: object
                    additionalProperties: false
                    properties:
                      mode:
                        enum:
                        - rotation
                        - translation
                      axis:
                        type: array
                        minItems: 3
                        maxItems: 3
                        items:
                          type: number
                      magnitude: *id004
                      speed: *id004
                      direction:
                        enum:
                        - cw
                        - ccw
                        - forward
                        - backward
                      tolerance: *id004
                    required:
                    - mode
                    - axis
                    - magnitude
                    - speed
                    - direction
                    - tolerance
                required:
                - process_type
                - engagement
                - hold_s
                - transform
      motion_authorized:
        const: false
  - type: object
    additionalProperties: false
    required:
    - status
    - error
    - motion_authorized
    properties:
      status:
        const: unavailable
      error: *id005
      motion_authorized:
        const: false
