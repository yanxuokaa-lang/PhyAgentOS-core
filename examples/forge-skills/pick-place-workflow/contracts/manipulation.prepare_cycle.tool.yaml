tool_id: manipulation.prepare_cycle
endpoint_id: cycle_preparation
operation: prepare
semantics: query
description: Prepare a complete manipulation cycle from empty hand without motion.
planning:
  schema_version: paos-tool-spec-policy/v1
  capabilities:
  - manipulation.prepare_cycle
  input_binding_keys:
  - entity_ref
  - destination_ref
  scene_write_behavior: none
input_schema:
  type: object
  additionalProperties: false
  properties:
    entity_ref:
      type: string
      minLength: 1
      pattern: ^entity://[^/]+$
    destination_ref:
      type: string
      minLength: 1
      pattern: ^destination://\S+$
    return_destination_ref:
      type: string
      minLength: 1
      pattern: ^destination://\S+$
    observation_ref:
      type: string
      minLength: 1
    scene_revision:
      type: string
      minLength: 1
    frame_id:
      type: string
      minLength: 1
    calibration_ref:
      type: string
      minLength: 1
    capability_snapshot_ref:
      type: string
      minLength: 1
    operation:
      enum:
      - pour_cycle
      - stir_cycle
      - manipulation_cycle
    parameters:
      type: object
    freshness_ms:
      type: integer
      minimum: 0
    max_age_ms:
      type: integer
      minimum: 1
    manipulation_target:
      type: object
      additionalProperties: false
      required:
      - entity_ref
      - destination_ref
      - scene_revision
      - frame_id
      - calibration_ref
      - control_frame_id
      - world_from_control
      - entity_prim_path
      - destination_prim_path
      - object_pose
      - grasp_frame
      - approach_direction
      - destination_pose
      - return_pose
      properties:
        candidate_ref:
          type: string
          pattern: ^candidate://[^/]+/.+$
        entity_ref:
          type: string
          pattern: ^entity://[^/]+$
        destination_ref:
          type: string
          pattern: ^destination://\S+$
        scene_revision:
          type: string
          minLength: 1
        frame_id:
          type: string
          minLength: 1
        calibration_ref:
          type: string
          minLength: 1
        control_frame_id:
          type: string
          minLength: 1
        world_from_control:
          type: object
          additionalProperties: false
          required:
          - parent_frame_id
          - child_frame_id
          - translation_m
          - orientation_xyzw
          properties:
            parent_frame_id:
              const: world
            child_frame_id:
              type: string
              minLength: 1
            translation_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
            orientation_xyzw:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: number
        entity_prim_path:
          type: string
          pattern: ^/World/.+
        destination_prim_path:
          type: string
          pattern: ^/World/.+
        tool_prim_path:
          type: string
          pattern: ^/World/.+
        object_pose:
          type: object
          additionalProperties: false
          required:
          - frame_id
          - unit
          - position_m
          - orientation_xyzw
          properties:
            frame_id:
              type: string
              minLength: 1
            unit:
              const: m
            position_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
            orientation_xyzw:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: number
        grasp_frame:
          type: object
          additionalProperties: false
          required:
          - frame_id
          - unit
          - position_m
          - orientation_xyzw
          properties:
            frame_id:
              type: string
              minLength: 1
            unit:
              const: m
            position_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
            orientation_xyzw:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: number
        destination_pose:
          type: object
          additionalProperties: false
          required:
          - frame_id
          - unit
          - position_m
          - orientation_xyzw
          properties:
            frame_id:
              type: string
              minLength: 1
            unit:
              const: m
            position_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
            orientation_xyzw:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: number
        return_pose:
          type: object
          additionalProperties: false
          required:
          - frame_id
          - unit
          - position_m
          - orientation_xyzw
          properties:
            frame_id:
              type: string
              minLength: 1
            unit:
              const: m
            position_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
            orientation_xyzw:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: number
        approach_direction:
          type: object
          additionalProperties: false
          required:
          - frame_id
          - unit
          - vector
          properties:
            frame_id:
              type: string
              minLength: 1
            unit:
              const: unitless
            vector:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
        tool_frame:
          type: object
          additionalProperties: false
          required:
          - frame_id
          - tip_axis_local
          properties:
            frame_id:
              type: string
              minLength: 1
            tip_axis_local:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
            tip_offset_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
        process_frame:
          type: object
          additionalProperties: false
          required:
          - frame_id
          - origin_m
          - axis
          properties:
            frame_id:
              type: string
              minLength: 1
            origin_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
            axis:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
        geometry:
          type: object
          additionalProperties: false
          properties:
            size_m:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
        placement_tolerance_m:
          type: number
          exclusiveMinimum: 0
  required:
  - entity_ref
  - destination_ref
  - return_destination_ref
  - observation_ref
  - scene_revision
  - frame_id
  - calibration_ref
  - capability_snapshot_ref
  - operation
  - parameters
  - freshness_ms
  - max_age_ms
  allOf:
  - if:
      properties:
        operation:
          const: pour_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            tilt_rad:
              type: number
              exclusiveMinimum: 0
              maximum: 3.141592653589793
            hold_s:
              type: number
              exclusiveMinimum: 0
          required:
          - tilt_rad
          - hold_s
  - if:
      properties:
        operation:
          const: stir_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            radius_m: &id001
              type: number
              exclusiveMinimum: 0
            depth_m: *id001
            turns: *id001
            duration_s: *id001
            direction:
              enum:
              - cw
              - ccw
          required:
          - radius_m
          - depth_m
          - turns
          - duration_s
          - direction
  - if:
      properties:
        operation:
          const: manipulation_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            process_type:
              enum:
              - pour
              - stir
              - handle_rotation
              - cap_unscrew
              - cap_screw
            engagement:
              enum:
              - held_object
              - tool
              - handle
              - cap
            hold_s: &id002
              type: number
              exclusiveMinimum: 0
            transform:
              type: object
              additionalProperties: false
              properties:
                mode:
                  enum:
                  - rotation
                  - translation
                axis:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                magnitude: *id002
                speed: *id002
                direction:
                  enum:
                  - cw
                  - ccw
                  - forward
                  - backward
                tolerance: *id002
              required:
              - mode
              - axis
              - magnitude
              - speed
              - direction
              - tolerance
          required:
          - process_type
          - engagement
          - hold_s
          - transform
