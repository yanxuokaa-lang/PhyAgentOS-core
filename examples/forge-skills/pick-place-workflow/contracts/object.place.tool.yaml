tool_id: object.place
implementation_id: object.placement
endpoint_id: object_placement
operation: place
semantics: action
planning:
  schema_version: paos-tool-spec-policy/v1
  capabilities: [object.place]
  scene_write_behavior: new_revision
  input_binding_keys: [entity_ref, destination_ref]
  argument_projection: completed_acquisition_action_v1
  argument_projection_plan:
    projection_id: completed_acquisition_action_v1
    join_field: entity_ref
    source_slots:
      acquisition:
        tool_id: object.acquire
        source_scope: predecessor
        scene_relation: predecessor_effect
        join_field_path: [result, entity_ref]
        source_field_map:
          observation_ref: [result, observation_ref]
          scene_revision: [result, new_scene_revision]
          frame_id: [result, frame, frame_id]
          calibration_ref: [result, calibration_ref]
          freshness_ms: [freshness_ms]
          max_age_ms: [max_age_ms]
          candidate_set_ref: [result, candidate_set_ref]
          preparation_ref: [result, preparation_ref]
          candidate_ref: [result, candidate_ref]
          acquire_invocation_ref: [invocation_id]
          capability_snapshot_ref: [result, capability_snapshot_ref]
          assignment_ref: [result, assignment_ref]
    top_level_fields: [entity_ref, destination_ref]
description: >-
  Admit one bounded object placement workflow using a completed acquisition and a destination
  reference; transport, descent, release, and retreat remain internal Gateway phases.
input_schema:
  type: object
  additionalProperties: false
  required: [observation_ref, scene_revision, frame_id, calibration_ref, freshness_ms, max_age_ms, candidate_set_ref, preparation_ref, candidate_ref, entity_ref, acquire_invocation_ref, destination_ref, capability_snapshot_ref, assignment_ref]
  properties:
    observation_ref: {type: string, pattern: '^observation://[^/]+/[^/]+$'}
    scene_revision: {type: string, minLength: 1}
    frame_id: {type: string, minLength: 1}
    calibration_ref: {type: string, minLength: 1}
    freshness_ms: {type: integer, minimum: 0}
    max_age_ms: {type: integer, minimum: 1}
    candidate_set_ref: {type: string, pattern: '^candidate-set://[^/]+/.+$'}
    preparation_ref: {type: string, pattern: '^preparation://[^/]+/.+$'}
    candidate_ref: {type: string, pattern: '^candidate://[^/]+/.+$'}
    entity_ref: {type: string, pattern: '^entity://[^/]+$'}
    acquire_invocation_ref: {type: string, pattern: '^invocation://object-acquire/[^/]+$'}
    destination_ref: {type: string, pattern: '^destination://[^\s]+$'}
    capability_snapshot_ref: {type: string, pattern: '^artifact://[^/]+/.+$'}
    assignment_ref: {type: string, pattern: '^artifact://[^/]+/.+$'}
output_schema:
  type: object
  additionalProperties: false
  required: [invocation_id, attempt_id, phase]
  properties:
    invocation_id: {type: string, pattern: '^invocation://[^/]+/.+$'}
    attempt_id: {type: string, pattern: '^attempt://[^/]+/.+$'}
    phase: {enum: [accepted, running, completed, failed, cancelled, stopped, unknown]}
    cancel_requested: {type: boolean}
    result:
      type: object
      additionalProperties: false
      required: [status, observation_ref, scene_revision, frame, calibration_ref, candidate_set_ref, preparation_ref, candidate_ref, entity_ref, acquire_invocation_ref, destination_ref, capability_snapshot_ref, assignment_ref, capability_outcome_summary, release_confirmed, retreat_completed, clear_of_target, observation_ready, new_scene_revision]
      properties:
        status: {enum: [succeeded, failed, cancelled, stopped, unknown]}
        observation_ref: {type: string, pattern: '^observation://[^/]+/[^/]+$'}
        scene_revision: {type: string, minLength: 1}
        frame:
          type: object
          additionalProperties: false
          required: [frame_id, unit]
          properties:
            frame_id: {type: string, minLength: 1}
            unit: {const: m}
        calibration_ref: {type: string, minLength: 1}
        candidate_set_ref: {type: string, pattern: '^candidate-set://[^/]+/.+$'}
        preparation_ref: {type: string, pattern: '^preparation://[^/]+/.+$'}
        candidate_ref: {type: string, pattern: '^candidate://[^/]+/.+$'}
        entity_ref: {type: string, pattern: '^entity://[^/]+$'}
        acquire_invocation_ref: {type: string, pattern: '^invocation://object-acquire/[^/]+$'}
        destination_ref: {type: string, pattern: '^destination://[^\s]+$'}
        capability_snapshot_ref: {type: string, pattern: '^artifact://[^/]+/.+$'}
        assignment_ref: {type: string, pattern: '^artifact://[^/]+/.+$'}
        release_confirmed: {type: boolean}
        retreat_completed: {type: boolean}
        clear_of_target: {type: boolean}
        observation_ready: {type: boolean}
        new_scene_revision: {type: [string, 'null']}
        capability_outcome_summary:
          type: object
          additionalProperties: false
          required: [version, capability_phase, status, failure_owner, failure_code, world_change_started, outcome_known, evidence_availability, artifact_refs, post_release_evidence, release_confirmed, retreat_completed, clear_of_target, observation_ready, new_scene_revision, bounded_metric_names, retryable_in_revision, requires_replan, recommended_action, phase, selected_arm, failed_phase, arm_attempts, evidence_refs]
          properties:
            version: {const: capability_outcome_summary_v1}
            capability_phase: {enum: [transport, descent, release, retreat, none]}
            status: {enum: [succeeded, failed, cancelled, stopped, unknown]}
            failure_owner: {enum: [none, input, binding, readiness, planner, execution, evidence, settlement, operator, infrastructure, null]}
            failure_code: {type: [string, 'null']}
            world_change_started: {type: boolean}
            outcome_known: {type: boolean}
            evidence_availability: {enum: [complete, partial, none, unknown]}
            artifact_refs:
              type: array
              items: {type: string, pattern: '^artifact://[^/]+/.+$'}
            post_release_evidence:
              type: object
              additionalProperties: false
              required: [availability, artifact_refs]
              properties:
                availability: {enum: [complete, partial, none, unknown]}
                artifact_refs:
                  type: array
                  items: {type: string, pattern: '^artifact://[^/]+/.+$'}
            release_confirmed: {type: boolean}
            retreat_completed: {type: boolean}
            clear_of_target: {type: boolean}
            observation_ready: {type: boolean}
            new_scene_revision: {type: [string, 'null']}
            bounded_metric_names:
              type: array
              items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
            retryable_in_revision: {type: boolean}
            requires_replan: {type: boolean}
            recommended_action: {type: string, minLength: 1}
            phase: {type: string, minLength: 1}
            selected_arm: {type: [string, 'null']}
            failed_phase: {type: [string, 'null']}
            arm_attempts:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [arm, status]
                properties:
                  arm: {type: string, minLength: 1}
                  status: {enum: [pass, fail]}
                  failed_phase: {type: [string, 'null']}
                  failed_waypoint_index: {type: [integer, 'null'], minimum: 0}
                  detail: {type: [string, 'null']}
            evidence_refs:
              type: array
              items: {type: string, pattern: '^artifact://[^/]+/.+$'}
robot_frame_profile:
  observation_frame: observation
  unit: m
  orientation_convention: candidate-bound
max_concurrency: 1
cancellation: supported_via_common_cancel_route
unknown_semantics: terminal_for_accounting_not_physical_stop
