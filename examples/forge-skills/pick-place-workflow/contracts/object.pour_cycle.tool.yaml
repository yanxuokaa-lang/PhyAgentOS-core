  - freshness_ms
  - max_age_ms
  - preparation_ref
  - assignment_ref
  allOf:
  - if:
      properties:
        operation:
          const: pour_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            tilt_rad:
              type: number
              exclusiveMinimum: 0
              maximum: 3.141592653589793
            hold_s:
              type: number
              exclusiveMinimum: 0
          required:
          - tilt_rad
          - hold_s
  - if:
      properties:
        operation:
          const: stir_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            radius_m: &id001
              type: number
              exclusiveMinimum: 0
            depth_m: *id001
            turns: *id001
            duration_s: *id001
            direction:
              enum:
              - cw
              - ccw
          required:
          - radius_m
          - depth_m
          - turns
          - duration_s
          - direction
  - if:
      properties:
        operation:
          const: manipulation_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            process_type:
              enum:
              - pour
              - stir
              - handle_rotation
              - cap_unscrew
              - cap_screw
            engagement:
              enum:
              - held_object
              - tool
              - handle
              - cap
            hold_s: &id002
              type: number
              exclusiveMinimum: 0
            transform:
              type: object
              additionalProperties: false
              properties:
                mode:
                  enum:
                  - rotation
                  - translation
                axis:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                magnitude: *id002
                speed: *id002
                direction:
                  enum:
                  - cw
                  - ccw
                  - forward
                  - backward
                tolerance: *id002
              required:
              - mode
              - axis
              - magnitude
              - speed
              - direction
              - tolerance
          required:
          - process_type
          - engagement
          - hold_s
          - transform
