  schema_version: paos-tool-spec-policy/v1
  capabilities:
  - object.pour_cycle
  input_binding_keys:
  - entity_ref
  - destination_ref
  - return_destination_ref
  scene_write_behavior: new_revision
  argument_projection: prepared_cycle_operation_v1
  argument_projection_plan:
    projection_id: prepared_cycle_operation_v1
    join_field: entity_ref
    source_slots:
      preparation:
        tool_id: manipulation.prepare_cycle
        source_scope: predecessor
        source_field_map:
          entity_ref:
          - arguments
          - entity_ref
          destination_ref:
          - arguments
          - destination_ref
          return_destination_ref:
