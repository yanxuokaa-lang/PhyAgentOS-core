tool_id: manipulation.prepare_held
endpoint_id: held_preparation
operation: prepare
semantics: query
description: Prepare a bounded operation from current held-object and scene evidence
  without motion.
planning:
  schema_version: paos-tool-spec-policy/v1
  capabilities:
  - manipulation.prepare_held
  input_binding_keys:
  - entity_ref
  - destination_ref
  scene_write_behavior: none
input_schema:
  type: object
  additionalProperties: false
  properties:
    entity_ref:
      type: string
      minLength: 1
      pattern: ^entity://[^/]+$
    destination_ref:
      type: string
      minLength: 1
      pattern: ^destination://\S+$
    observation_ref:
      type: string
      minLength: 1
    scene_revision:
      type: string
      minLength: 1
    frame_id:
      type: string
      minLength: 1
    calibration_ref:
      type: string
      minLength: 1
    capability_snapshot_ref:
      type: string
      minLength: 1
    acquire_invocation_ref:
      type: string
      minLength: 1
      pattern: ^invocation://object-acquire/[^/]+$
    held_invocation_ref:
      type: string
      minLength: 1
      pattern: ^invocation://[^/]+/[^/]+$
    operation:
      enum:
      - pour
      - stir
      - place
    parameters:
      type: object
    freshness_ms:
      type: integer
      minimum: 0
    max_age_ms:
      type: integer
      minimum: 1
  required:
  - entity_ref
  - destination_ref
  - observation_ref
  - scene_revision
  - frame_id
  - calibration_ref
  - capability_snapshot_ref
  - acquire_invocation_ref
  - held_invocation_ref
  - operation
  - parameters
  - freshness_ms
  - max_age_ms
  allOf:
  - if:
      properties:
        operation:
          const: pour
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            tilt_rad:
              type: number
              exclusiveMinimum: 0
              maximum: 3.141592653589793
            hold_s:
              type: number
              exclusiveMinimum: 0
          required:
          - tilt_rad
          - hold_s
  - if:
      properties:
        operation:
          const: stir
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            radius_m: &id001
              type: number
              exclusiveMinimum: 0
            depth_m: *id001
            turns: *id001
            duration_s: *id001
          required:
          - radius_m
          - depth_m
          - turns
          - duration_s
  - if:
      properties:
        operation:
          const: place
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties: {}
          required: []
output_schema:
  oneOf:
  - type: object
    additionalProperties: false
    required:
    - status
    - entity_ref
    - arguments
    - motion_authorized
    properties:
      status:
        const: available
      entity_ref: &id003
        type: string
        minLength: 1
      arguments:
        type: object
        additionalProperties: false
        properties:
          entity_ref:
            type: string
            minLength: 1
            pattern: ^entity://[^/]+$
          destination_ref:
            type: string
            minLength: 1
            pattern: ^destination://\S+$
          observation_ref:
            type: string
            minLength: 1
          scene_revision:
            type: string
            minLength: 1
          frame_id:
            type: string
            minLength: 1
          calibration_ref:
            type: string
            minLength: 1
          capability_snapshot_ref:
            type: string
            minLength: 1
          acquire_invocation_ref:
            type: string
            minLength: 1
            pattern: ^invocation://object-acquire/[^/]+$
          held_invocation_ref:
            type: string
            minLength: 1
            pattern: ^invocation://[^/]+/[^/]+$
          operation:
            enum:
            - pour
            - stir
            - place
          parameters:
            type: object
          freshness_ms:
            type: integer
            minimum: 0
          max_age_ms:
            type: integer
            minimum: 1
          preparation_ref:
            type: string
            minLength: 1
          assignment_ref:
            type: string
            minLength: 1
        required:
        - entity_ref
        - destination_ref
        - observation_ref
        - scene_revision
        - frame_id
        - calibration_ref
        - capability_snapshot_ref
        - acquire_invocation_ref
        - held_invocation_ref
        - operation
        - parameters
        - freshness_ms
        - max_age_ms
        - preparation_ref
        - assignment_ref
        allOf:
        - if:
            properties:
              operation:
                const: pour
          then:
            properties:
              parameters:
                type: object
                additionalProperties: false
                properties:
                  tilt_rad:
                    type: number
                    exclusiveMinimum: 0
                    maximum: 3.141592653589793
                  hold_s:
                    type: number
                    exclusiveMinimum: 0
                required:
                - tilt_rad
                - hold_s
        - if:
            properties:
              operation:
                const: stir
          then:
            properties:
              parameters:
                type: object
                additionalProperties: false
                properties:
                  radius_m: &id002
                    type: number
                    exclusiveMinimum: 0
                  depth_m: *id002
                  turns: *id002
                  duration_s: *id002
                required:
                - radius_m
                - depth_m
                - turns
                - duration_s
        - if:
            properties:
              operation:
                const: place
          then:
            properties:
              parameters:
                type: object
                additionalProperties: false
                properties: {}
                required: []
      motion_authorized:
        const: false
  - type: object
    additionalProperties: false
    required:
    - status
    - error
    - motion_authorized
    properties:
      status:
        const: unavailable
      error: *id003
      motion_authorized:
        const: false
