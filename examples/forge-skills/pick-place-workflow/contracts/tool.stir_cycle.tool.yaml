tool_id: tool.stir_cycle
endpoint_id: tool_stir_cycle
operation: stir_cycle
semantics: action
description: Execute a complete stir_cycle cycle from empty hand through return.
planning:
  schema_version: paos-tool-spec-policy/v1
  capabilities:
  - tool.stir_cycle
  input_binding_keys:
  - entity_ref
  - destination_ref
  - return_destination_ref
  scene_write_behavior: new_revision
  argument_projection: prepared_cycle_operation_v1
  argument_projection_plan:
    projection_id: prepared_cycle_operation_v1
    join_field: entity_ref
    source_slots:
      preparation:
        tool_id: manipulation.prepare_cycle
        source_scope: predecessor
        source_field_map:
          entity_ref:
          - arguments
          - entity_ref
          destination_ref:
          - arguments
          - destination_ref
          return_destination_ref:
          - arguments
          - return_destination_ref
          observation_ref:
          - arguments
          - observation_ref
          scene_revision:
          - arguments
          - scene_revision
          frame_id:
          - arguments
          - frame_id
          calibration_ref:
          - arguments
          - calibration_ref
          capability_snapshot_ref:
          - arguments
          - capability_snapshot_ref
          operation:
          - arguments
          - operation
          parameters:
          - arguments
          - parameters
          freshness_ms:
          - arguments
          - freshness_ms
          max_age_ms:
          - arguments
          - max_age_ms
          preparation_ref:
          - arguments
          - preparation_ref
          assignment_ref:
          - arguments
          - assignment_ref
    top_level_fields: []
input_schema:
  type: object
  additionalProperties: false
  properties:
    entity_ref:
      type: string
      minLength: 1
      pattern: ^entity://[^/]+$
    destination_ref:
      type: string
      minLength: 1
      pattern: ^destination://\S+$
    return_destination_ref:
      type: string
      minLength: 1
      pattern: ^destination://\S+$
    observation_ref:
      type: string
      minLength: 1
    scene_revision:
      type: string
      minLength: 1
    frame_id:
      type: string
      minLength: 1
    calibration_ref:
      type: string
      minLength: 1
    capability_snapshot_ref:
      type: string
      minLength: 1
    operation:
      const: stir_cycle
    parameters:
      type: object
    freshness_ms:
      type: integer
      minimum: 0
    max_age_ms:
      type: integer
      minimum: 1
    preparation_ref:
      type: string
      minLength: 1
    assignment_ref:
      type: string
      minLength: 1
  required:
  - entity_ref
  - destination_ref
  - return_destination_ref
  - observation_ref
  - scene_revision
  - frame_id
  - calibration_ref
  - capability_snapshot_ref
  - operation
  - parameters
  - freshness_ms
  - max_age_ms
  - preparation_ref
  - assignment_ref
  allOf:
  - if:
      properties:
        operation:
          const: pour_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            tilt_rad:
              type: number
              exclusiveMinimum: 0
              maximum: 3.141592653589793
            hold_s:
              type: number
              exclusiveMinimum: 0
          required:
          - tilt_rad
          - hold_s
  - if:
      properties:
        operation:
          const: stir_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            radius_m: &id001
              type: number
              exclusiveMinimum: 0
            depth_m: *id001
            turns: *id001
            duration_s: *id001
            direction:
              enum:
              - cw
              - ccw
          required:
          - radius_m
          - depth_m
          - turns
          - duration_s
          - direction
  - if:
      properties:
        operation:
          const: manipulation_cycle
    then:
      properties:
        parameters:
          type: object
          additionalProperties: false
          properties:
            process_type:
              enum:
              - pour
              - stir
              - handle_rotation
              - cap_unscrew
              - cap_screw
            engagement:
              enum:
              - held_object
              - tool
              - handle
              - cap
            hold_s: &id002
              type: number
              exclusiveMinimum: 0
            transform:
              type: object
              additionalProperties: false
              properties:
                mode:
                  enum:
                  - rotation
                  - translation
                axis:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                magnitude: *id002
                speed: *id002
                direction:
                  enum:
                  - cw
                  - ccw
                  - forward
                  - backward
                tolerance: *id002
              required:
              - mode
              - axis
              - magnitude
              - speed
              - direction
              - tolerance
          required:
          - process_type
          - engagement
          - hold_s
          - transform
output_schema:
  type: object
  required:
  - invocation_id
  - attempt_id
  - phase
  properties:
    invocation_id: &id003
      type: string
      minLength: 1
    attempt_id: *id003
    phase: *id003
    result:
      type: object
      additionalProperties: false
      properties:
        entity_ref:
          type: string
          minLength: 1
          pattern: ^entity://[^/]+$
        destination_ref:
          type: string
          minLength: 1
          pattern: ^destination://\S+$
        return_destination_ref:
          type: string
          minLength: 1
          pattern: ^destination://\S+$
        observation_ref:
          type: string
          minLength: 1
        scene_revision:
          type: string
          minLength: 1
        frame_id:
          type: string
          minLength: 1
        calibration_ref:
          type: string
          minLength: 1
        capability_snapshot_ref:
          type: string
          minLength: 1
        operation:
          const: stir_cycle
        parameters:
          type: object
        freshness_ms:
          type: integer
          minimum: 0
        max_age_ms:
          type: integer
          minimum: 1
        preparation_ref:
          type: string
          minLength: 1
        assignment_ref:
          type: string
          minLength: 1
        status:
          enum:
          - succeeded
          - failed
          - cancelled
          - stopped
          - unknown
        new_scene_revision:
          type:
          - string
          - 'null'
        operation_completed:
          type: boolean
        process_completed:
          type: boolean
        return_completed:
          type: boolean
        failed_phase:
          type:
          - string
          - 'null'
        possession_state:
          enum:
          - empty
          - holding
          - uncertain
        phase_facts:
          type: object
        completed_phases:
          type: array
          items: *id003
        measurements:
          type: object
        evidence_refs:
          type: array
          items: *id003
        capability_outcome_summary:
          type: object
      required:
      - status
      - operation_completed
      - process_completed
      - return_completed
      - failed_phase
      - possession_state
      - phase_facts
      - completed_phases
      - measurements
      - evidence_refs
      - capability_outcome_summary
      - entity_ref
      - destination_ref
      - return_destination_ref
      - observation_ref
      - scene_revision
      - frame_id
      - calibration_ref
      - capability_snapshot_ref
      - operation
      - parameters
      - freshness_ms
      - max_age_ms
      - preparation_ref
      - assignment_ref
