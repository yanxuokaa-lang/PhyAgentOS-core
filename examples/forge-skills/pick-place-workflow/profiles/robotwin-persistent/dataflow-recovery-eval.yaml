nodes:
  - id: robotwin20_persistent_host
    command: ${PAOS_SKILL_ROOT}/nodes/robotwin20_persistent_host
    args: --profile ${PAOS_SKILL_ROOT}/profiles/robotwin-persistent/persistent-host-recovery-eval.yaml
    env:
      ROBOTWIN20_GRASP_PROFILE: ${ROBOTWIN20_GRASP_PROFILE}
      ROBOTWIN20_MATERIALIZER_ARGUMENTS: ${ROBOTWIN20_MATERIALIZER_ARGUMENTS}
      ROBOTWIN20_MODEL_API_BASE: ${ROBOTWIN20_MODEL_API_BASE}
      ROBOTWIN20_MODEL: ${ROBOTWIN20_MODEL}
      ROBOTWIN20_REASONING_EFFORT: ${ROBOTWIN20_REASONING_EFFORT}
      ROBOTWIN20_QWEN_MODEL_PATH: ${ROBOTWIN20_QWEN_MODEL_PATH}
      ROBOTWIN20_QWEN_PYTHON: ${ROBOTWIN20_QWEN_PYTHON}
      GRASPNET_PYTHON: ${GRASPNET_PYTHON}
      GRASPNET_CHECKPOINT: ${GRASPNET_CHECKPOINT}
      GRASPNET_SOURCE_ROOT: ${GRASPNET_SOURCE_ROOT}
      GRASPNET_DEVICE: ${GRASPNET_DEVICE}
      LOCATEANYTHING_PYTHON: ${LOCATEANYTHING_PYTHON}
      LOCATEANYTHING_CACHE_DIR: ${LOCATEANYTHING_CACHE_DIR}
      LOCATEANYTHING_MODULES_CACHE_DIR: ${LOCATEANYTHING_MODULES_CACHE_DIR}
      SAM2_PYTHON: ${SAM2_PYTHON}
      SAM2_REPO_ROOT: ${SAM2_REPO_ROOT}
      SAM2_CHECKPOINT: ${SAM2_CHECKPOINT}
