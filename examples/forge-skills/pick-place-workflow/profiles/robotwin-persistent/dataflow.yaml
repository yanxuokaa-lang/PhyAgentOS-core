nodes:
  - id: robotwin20_persistent_host
    path: ${FORGE_RUNTIME_BIN}/robotwin20_persistent_host
    args: --profile ${PAOS_SKILL_ROOT}/profiles/robotwin-persistent/persistent-host.yaml
    env:
      PAOS_ROBOTWIN20_ADAPTER_ROOT: ${PAOS_ROBOTWIN20_ADAPTER_ROOT}
      ROBOTWIN20_ARTIFACT_ROOT: ${ROBOTWIN20_ARTIFACT_ROOT}
      ROBOTWIN20_RUNTIME_ROOT: ${ROBOTWIN20_RUNTIME_ROOT}
      ROBOTWIN20_RUNTIME_PROFILE: ${ROBOTWIN20_RUNTIME_PROFILE}
      ROBOTWIN20_WORKER_PYTHON: ${ROBOTWIN20_WORKER_PYTHON}
      ROBOTWIN20_MATERIALIZER_PYTHON: ${ROBOTWIN20_MATERIALIZER_PYTHON}
      ROBOTWIN20_MODEL_API_BASE: ${ROBOTWIN20_MODEL_API_BASE}
      ROBOTWIN20_MODEL: ${ROBOTWIN20_MODEL}
      ROBOTWIN20_MODEL_API_KEY: ${ROBOTWIN20_MODEL_API_KEY}
      LOCATEANYTHING_PYTHON: ${LOCATEANYTHING_PYTHON}
      LOCATEANYTHING_CACHE_DIR: ${LOCATEANYTHING_CACHE_DIR}
      LOCATEANYTHING_MODULES_CACHE_DIR: ${LOCATEANYTHING_MODULES_CACHE_DIR}
      SAM2_PYTHON: ${SAM2_PYTHON}
      SAM2_REPO_ROOT: ${SAM2_REPO_ROOT}
      SAM2_CHECKPOINT: ${SAM2_CHECKPOINT}
      GRASPGEN_PYTHON: ${GRASPGEN_PYTHON}
      GRASPGEN_CHECKPOINT: ${GRASPGEN_CHECKPOINT}
      GRASPGEN_CONFIG: ${GRASPGEN_CONFIG}
      GRASPGEN_SOURCE_ROOT: ${GRASPGEN_SOURCE_ROOT}
      ROBOTWIN20_CONTROLLER_QUALIFICATION: ${ROBOTWIN20_CONTROLLER_QUALIFICATION}
      ROBOTWIN20_CONTROLLER_QUALIFICATION_PLAN: ${ROBOTWIN20_CONTROLLER_QUALIFICATION_PLAN}
      ROBOTWIN20_CONTROLLER_QUALIFICATION_EVIDENCE: ${ROBOTWIN20_CONTROLLER_QUALIFICATION_EVIDENCE}
      ROBOTWIN20_CONTROLLER_QUALIFICATION_VALIDATION: ${ROBOTWIN20_CONTROLLER_QUALIFICATION_VALIDATION}
      ROBOTWIN20_LEFT_MOTION_CAPABILITY: ${ROBOTWIN20_LEFT_MOTION_CAPABILITY}
      ROBOTWIN20_LEFT_MOTION_CAPABILITY_VALIDATION: ${ROBOTWIN20_LEFT_MOTION_CAPABILITY_VALIDATION}
      ROBOTWIN20_RIGHT_MOTION_CAPABILITY: ${ROBOTWIN20_RIGHT_MOTION_CAPABILITY}
      ROBOTWIN20_RIGHT_MOTION_CAPABILITY_VALIDATION: ${ROBOTWIN20_RIGHT_MOTION_CAPABILITY_VALIDATION}
    inputs:
      tick: dora/timer/millis/1000
